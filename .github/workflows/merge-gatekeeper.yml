name: Merge Gatekeeper

# Placeholder gatekeeper.
#
# Branch protection on `main` requires a status check named
# `merge-gatekeeper`. The real check used
# `veedstudio/actions/merge-gatekeeper@master`, but that action repo is
# INTERNAL and a PUBLIC repo's GITHUB_TOKEN cannot pull internal action
# code, so the real check fails to resolve on every PR.
#
# Until that is resolved (e.g. by vendoring the action or making this repo
# able to consume it), this no-op job reports a passing `merge-gatekeeper`
# check so the required-status-check rule can be satisfied. This repo has no
# other CI for a real gatekeeper to gate.

on:
  pull_request:
    branches:
      - main

jobs:
  merge-gatekeeper:
    runs-on: ubuntu-latest
    steps:
      - name: Pass
        run: echo "merge-gatekeeper placeholder — no real gating in this repo yet"
