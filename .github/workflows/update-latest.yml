name: Update latest.json on release

# The upstream private monorepo builds the binary and publishes a `weave-v*`
# Release here with assets: weave-viewer-cli-macos-arm64.tar.gz(.sha256) +
# feature-support.md + weave-extensions.md. On each published release we refresh
# latest.json (version + sha256 + url + published_at) and the shipped docs/.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. weave-v0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  update-latest:
    runs-on: ubuntu-latest
    steps:
      # Check out the default branch tip (not the release tag's detached commit)
      # so the commit step below is a fast-forward push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Tag flows through env (never inline ${{ }} in the script body) to avoid
      # shell injection from an attacker-influenced tag name.
      - name: Refresh latest.json + docs from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TAG" in
            weave-v*) ;;
            *) echo "Tag '$TAG' is not a weave-v* release tag — skipping."; exit 0 ;;
          esac
          # Single source of truth: the committed script does the download + sha
          # extraction + latest.json build + docs refresh.
          scripts/update-latest.sh "$TAG"

      - name: Commit if changed
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json docs/feature-support.md docs/weave-extensions.md
          if git diff --cached --quiet; then
            echo "latest.json + docs already current; nothing to commit."
          else
            git commit -m "release: weave-viewer-cli $TAG"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
